---
- summary: |
    Ошибка 500 при оформлении заказа
  environment: |
    Браузер: Firefox 136.0.1
    ОС: Windows 11
  steps-to-reproduce: |
    1. Добавить товар в корзину
    2. Перейти в корзину
    3. Нажать "Оформить заказ"
  expected-result: |
    Переход на страницу оплаты
  actual-result: |
    Ошибка 500 Internal Server Error

- summary: |
    Некорректный перевод кнопки
  environment: |
    Браузер: Firefox 136.0.1
    ОС: Windows 11
  steps-to-reproduce: |
    1. Переключить язык на русский
    2. Открыть карточку товара
  expected-result: |
    Кнопка "Добавить в корзину"
  actual-result: |
    Кнопка "Добавить карту"

- summary: |
    Фильтрация товаров по категории работает некорректно
  environment: |
    Браузер: Mozilla Firefox 136.0.1 (64-bit)
    ОС: Windows 11
    Приложение: https://products-store-v2.hexlet.app/
  steps-to-reproduce: |
    1. Открыть главную страницу каталога
    2. Выбрать категорию "electronics"
  expected-result: |
    Отображаются только товары выбранной категории
  actual-result: |
    Фильтрация работает некорректно

