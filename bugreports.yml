---
- summary: |
    Ошибка 500 Internal Server Error при оформлении заказа
  environment: |
    Браузер: Mozilla Firefox 136.0.1 (64-bit)
    ОС: Windows 11
    Приложение: https://products-store-v2.hexlet.app/
  steps-to-reproduce: |
    1. Добавить любой товар в корзину
    2. Перейти на страницу корзины
    3. Нажать кнопку "Checkout" или "Оформить заказ"
  expected-result: |
    Происходит переход на страницу оплаты. Отображается форма для ввода платёжных данных.
  actual-result: |
    При нажатии на кнопку оформления заказа сервер возвращает ошибку 500 Internal Server Error. Пользователь остаётся на странице корзины. Сообщение об ошибке пользователю не отображается.

- summary: |
    Некорректный перевод кнопки на русском языке
  environment: |
    Браузер: Mozilla Firefox 136.0.1 (64-bit)
    ОС: Windows 11
    Приложение: https://products-store-v2.hexlet.app/
  steps-to-reproduce: |
    1. Переключить язык интерфейса на русский
    2. Открыть карточку любого товара
  expected-result: |
    Кнопка добавления товара в корзину должна называться "Добавить в корзину"
  actual-result: |
    Кнопка называется "Добавить карту"

- summary: |
    Фильтрация товаров по категории не применяется совместно с поиском
  environment: |
    Браузер: Mozilla Firefox 136.0.1 (64-bit)
    ОС: Windows 11
    Приложение: https://products-store-v2.hexlet.app/
  steps-to-reproduce: |
    1. Открыть главную страницу каталога
    2. В поле поиска ввести слово "Jacket"
    3. В фильтре категорий выбрать "Electronics"
  expected-result: |
    Должны отображаться только товары, которые одновременно содержат слово "Jacket" в названии и относятся к категории "Electronics"
  actual-result: |
    Поиск игнорирует выбранную категорию. В выдаче отображаются все товары со словом "Jacket", включая те, которые не относятся к категории "Electronics"

- summary: |
    Фильтрация товаров по цене не учитывает скидочную цену
  environment: |
    Браузер: Mozilla Firefox 136.0.1 (64-bit)
    ОС: Windows 11
    Приложение: https://products-store-v2.hexlet.app/
  steps-to-reproduce: |
    1. Открыть главную страницу каталога
    2. Установить фильтр цены от $50 до $100
    3. Найти товар "Dior J'adore" (старая цена $89.99, цена со скидкой $76.74)
  expected-result: |
    Товар "Dior J'adore" должен отображаться в выдаче, так как его скидочная цена ($76.74) попадает в диапазон от $50 до $100
  actual-result: |
    Товар "Dior J'adore" не отображается в выдаче. Фильтр применяется к старой цене ($89.99)

- summary: |
    Фильтрация товаров по производителю не работает
  environment: |
    Браузер: Mozilla Firefox 136.0.1 (64-bit)
    ОС: Windows 11
    Приложение: https://products-store-v2.hexlet.app/
  steps-to-reproduce: |
    1. Открыть главную страницу каталога
    2. В блоке фильтров в разделе "Brand" выбрать производителя "Mango"
  expected-result: |
    В каталоге отображаются только товары выбранного производителя "Mango"
  actual-result: |
    После выбора производителя "Mango" состав каталога не меняется. Отображаются все товары

- summary: |
    Фильтрация товаров по наличию не работает
  environment: |
    Браузер: Mozilla Firefox 136.0.1 (64-bit)
    ОС: Windows 11
    Приложение: https://products-store-v2.hexlet.app/
  steps-to-reproduce: |
    1. Открыть главную страницу каталога
    2. Отметить чекбокс "In Stock"
  expected-result: |
    В каталоге отображаются только товары с пометкой "In Stock"
  actual-result: |
    После отметки чекбокса "In Stock" состав каталога не меняется. Отображаются все товары

- summary: |
    Поиск товаров работает только по точному совпадению
  environment: |
    Браузер: Mozilla Firefox 136.0.1 (64-bit)
    ОС: Windows 11
    Приложение: https://products-store-v2.hexlet.app/
  steps-to-reproduce: |
    1. Открыть главную страницу каталога
    2. В поле поиска ввести часть названия товара, например "Jack"
  expected-result: |
    Должны отображаться товары, содержащие "Jack" в названии
  actual-result: |
    Поиск не находит товары по частичному совпадению. Результат поиска пуст

- summary: |
    Сброс языка интерфейса при переходе на главную страницу
  environment: |
    Браузер: Mozilla Firefox 136.0.1 (64-bit)
    ОС: Windows 11
    Приложение: https://products-store-v2.hexlet.app/
  steps-to-reproduce: |
    1. Переключить язык интерфейса с английского на русский
    2. Нажать на логотип или кнопку "Store"
  expected-result: |
    Язык интерфейса остаётся русским
  actual-result: |
    Язык интерфейса сбрасывается на английский
