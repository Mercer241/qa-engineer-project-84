---
- summary: |
    Ошибка 500 Internal Server Error при оформлении заказа
  environment: |
    Браузер: Mozilla Firefox 136.0.1 (64-bit)
    ОС: Windows 11
    Устройство: ПК
    Приложение: Интернет-магазин 
  steps-to-reproduce: |
    1. Добавить любой товар в корзину
    2. Перейти на страницу корзины
    3. Нажать кнопку "Checkout" или "Оформить заказ"
  expected-result: |
    Происходит переход на страницу оплаты.
  actual-result: |
    Сервер возвращает ошибку 500 Internal Server Error.

- summary: |
    Некорректный перевод кнопки на русском языке
  environment: |
    Браузер: Mozilla Firefox 136.0.1 (64-bit)
    ОС: Windows 11
  steps-to-reproduce: |
    1. Переключить язык на русский
    2. Открыть карточку товара
  expected-result: |
    Кнопка добавления называется "Добавить в корзину".
  actual-result: |
    Кнопка называется "Добавить карту".

- summary: |
    Фильтрация и поиск работают некорректно (не по полному тексту/каталогу)
  environment: |
    Браузер: Mozilla Firefox 136.0.1 (64-bit)
    ОС: Windows 11
  steps-to-reproduce: |
    1. Находясь в каталоге, ввести в поиск слово, которое является частью названия товара (например, "Jacket").
    2. Выбрать категорию, не соответствующую искомому товару.
  expected-result: |
    Поиск и фильтрация должны находить все подходящие товары во всем каталоге.
  actual-result: |
    Поиск не находит товары по частичному совпадению. Фильтр по категории игнорируется, если активен поиск (или наоборот).
