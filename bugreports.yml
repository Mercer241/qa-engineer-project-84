---
- summary: |
    Ошибка 500 Internal Server Error при оформлении заказа
  environment: |
    Браузер: Mozilla Firefox 136.0.1 (64-bit)
    ОС: Windows 11
    Устройство: ПК
    Приложение: Интернет-магазин (ссылка от Хекслета)
  steps-to-reproduce: |
    1. Добавить любой товар в корзину
    2. Перейти на страницу корзины
    3. Нажать кнопку "Checkout" или "Оформить заказ"
  expected-result: |
    Происходит переход на страницу оплаты. Отображается форма для ввода платёжных данных и адреса доставки.
  actual-result: |
    При нажатии на кнопку оформления заказа сервер возвращает ошибку 500 Internal Server Error. Пользователь остаётся на странице корзины или видит сообщение об ошибке.

- summary: |
    Некорректный перевод кнопки при добавлении товара в корзину в русскоязычной версии
  environment: |
    Браузер: Mozilla Firefox 136.0.1 (64-bit)
    ОС: Windows 11
    Устройство: ПК
    Приложение: Интернет-магазин (ссылка от Хекслета)
  steps-to-reproduce: |
    1. Переключить язык интерфейса на русский
    2. Открыть карточку любого товара
  expected-result: |
    Кнопка добавления товара в корзину должна называться "Добавить в корзину" или "Add to cart"
  actual-result: |
    Кнопка называется "Добавить карту", что является неверным переводом. Правильный перевод: "Добавить в корзину".
