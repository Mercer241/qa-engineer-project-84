---
- summary: |
    Успешное добавление товара в корзину с главной страницы каталога
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину
  prerequisites: |
    Открыта главная страница каталога
    Пользователь не авторизован
  test-data: |
    Любой товар в наличии
  steps:
    - Нажать кнопку "Add to cart" у выбранного товара
  expected-result: |
    Появляется уведомление о добавлении товара
    Значок корзины показывает количество товаров, увеличенное на 1

- summary: |
    Успешное отображение подробной информации о товаре
  requirement: |
    Пользователь должен иметь возможность просматривать подробную информацию о товаре
  prerequisites: |
    Открыта главная страница каталога
  test-data: |
    Любой товар
  steps:
    - Нажать на название товара или изображение товара
  expected-result: |
    Открылась страница с подробной информацией о выбранном товаре
    На странице отображаются: название, цена со скидкой, цена без скидки, рейтинг, описание

- summary: |
    Успешная фильтрация товаров по категории
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites: |
    Открыта главная страница каталога
    В каталоге есть товары разных категорий
  test-data: |
    Выбрать категорию "electronics" (или любую существующую)
  steps:
    - Выбрать категорию из списка фильтров
  expected-result: |
    В каталоге отображаются только товары выбранной категории
    Количество отображаемых товаров уменьшилось (если были товары других категорий)

- summary: |
    Успешный поиск товара по ключевому слову
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову
  prerequisites: |
    Открыта главная страница каталога
  test-data: |
    Ключевое слово: существующее название товара (например, "Fjallraven")
  steps:
    - Ввести ключевое слово в поле поиска
    - Нажать Enter или кнопку поиска
  expected-result: |
    В каталоге отображаются только товары, содержащие ключевое слово в названии или описании

- summary: |
    Удаление товара из корзины на странице корзины
  requirement: |
    На странице корзины пользователь может удалить товар из корзины
  prerequisites: |
    В корзине есть хотя бы один товар
    Открыта страница корзины
  test-data: |
    Любой товар в корзине
  steps:
    - Нажать кнопку "Remove" или иконку корзины у выбранного товара
  expected-result: |
    Выбранный товар исчезает из списка товаров в корзине
    Стоимость заказа пересчиталась (уменьшилась на стоимость удаленного товара)
    Количество товаров в иконке корзины уменьшилось

- summary: |
    Переключение языка интерфейса с английского на русский
  requirement: |
    Пользователь должен иметь возможность переключить язык интерфейса
  prerequisites: |
    Открыта любая страница магазина
    Текущий язык интерфейса — английский
  test-data: |
    Выбрать язык "Русский" или "Russian"
  steps:
    - Нажать на переключатель языка
    - Выбрать "Русский"
  expected-result: |
    Весь интерфейс отображается на русском языке
    Текст кнопок, меню, уведомлений переведен на русский
    Переключатель языка показывает текущий язык "Русский"

- summary: |
    Сохранение товаров в корзине после перезагрузки страницы
  requirement: |
    Корзина хранится в сессии браузера
  prerequisites: |
    В корзину добавлен хотя бы один товар
    Открыта любая страница магазина
  test-data: |
    Товар в корзине
  steps:
    - Перезагрузить страницу (F5 или Ctrl+R)
  expected-result: |
    Товары в корзине остались
    Количество товаров в иконке корзины соответствует добавленным ранее
    Стоимость заказа сохранилась

- summary: |
    Успешный переход на страницу оплаты из корзины
  requirement: |
    Пользователь может оформить заказ с переходом на страницу оплаты
  prerequisites: |
    В корзине есть хотя бы один товар
    Открыта страница корзины
  test-data: |
    Любой товар в корзине
  steps:
    - Нажать кнопку "Checkout" или "Оформить заказ"
  expected-result: |
    Произошел переход на страницу оплаты
    URL страницы содержит "/checkout" или "/payment"
    В корзине отображается список выбранных товаров и итоговая сумма

- summary: |
    Отображение цены со скидкой и без скидки на карточке товара
  requirement: |
    На странице товара и в каталоге выводится цена со скидкой и без нее
  prerequisites: |
    Открыта главная страница каталога
    В каталоге есть товар с действующей скидкой
  test-data: |
    Товар, у которого price < discountPrice (или аналогичное поле со скидкой)
  steps: |
    Найти товар с иконкой скидки (sale, -X%)
    Сравнить отображаемые цены
  expected-result: |
    Отображаются две цены: зачеркнутая старая цена (без скидки) и новая цена (со скидкой)
    Новая цена меньше старой
