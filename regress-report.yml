bugreports:
  - summary: |
      Ошибка 500 Internal Server Error при оформлении заказа (не исправлено)
    environment: |
      Ссылка на приложение: [https://products-store-v2.hexlet.app/]
      Браузер: Mozilla Firefox 136.0.1 (64-bit)
      ОС: Windows 11
      Устройство: ПК
    steps-to-reproduce: |
      1. Добавить любой товар в корзину
      2. Перейти на страницу корзины
      3. Нажать кнопку "Checkout" или "Оформить заказ"
    expected-result: |
      Происходит переход на страницу оплаты
    actual-result: |
      Сервер возвращает ошибку 500 Internal Server Error

  - summary: |
      Некорректный перевод кнопки на русском языке (не исправлено)
    environment: |
      Ссылка на приложение: [https://products-store-v2.hexlet.app/]
      Браузер: Mozilla Firefox 136.0.1 (64-bit)
      ОС: Windows 11
      Устройство: ПК
    steps-to-reproduce: |
      1. Переключить язык интерфейса на русский
      2. Открыть карточку любого товара
    expected-result: |
      Кнопка добавления товара в корзину называется "Добавить в корзину"
    actual-result: |
      Кнопка называется "Добавить карту"

  - summary: |
      Сброс языка интерфейса с русского на английский при переходе на главную страницу каталога (новый баг)
    environment: |
      Ссылка на приложение: [https://products-store-v2.hexlet.app/]
      Браузер: Mozilla Firefox 136.0.1 (64-bit)
      ОС: Windows 11
      Устройство: ПК
    steps-to-reproduce: |
      1. Переключить язык интерфейса на русский
      2. Нажать на кнопку "Store" или логотип магазина
    expected-result: |
      Язык интерфейса остаётся русским
    actual-result: |
      Язык интерфейса сбрасывается на английский
