bugreports:
  - summary: |
      Сброс языка интерфейса с русского на английский при переходе на главную страницу каталога
    environment: |
      Ссылка на приложение: https://products-store-v2.hexlet.app/
      Браузер: Mozilla Firefox 136.0.1 (64-bit)
      ОС: Windows 11
      Устройство: ПК
    steps-to-reproduce: |
      1. Переключить язык интерфейса на русский
      2. Убедиться, что интерфейс отображается на русском языке
      3. Нажать на кнопку "Store" или логотип магазина (переход на главную страницу каталога)
    expected-result: |
      Язык интерфейса остаётся русским
    actual-result: |
      Язык интерфейса сбрасывается на английский
